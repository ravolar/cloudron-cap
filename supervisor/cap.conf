# Cloudron stops containers with a 10 s grace period and supervisor stops the programs one after
# another (guard-proxy, cap-web, media-server), so their stopwaitsecs add up to less than that.
# guard-proxy.mjs owns the public port 3000 and forwards to Next on 127.0.0.1:3001; it blocks
# custom-storage endpoints (SSRF), internal endpoints and rate-limits expensive anonymous ones.
[program:guard-proxy]
priority=30
directory=/app/pkg
command=/app/pkg/app-env.sh node /app/pkg/guard-proxy.mjs
environment=NODE_ENV="production"
user=cloudron
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cap-web]
priority=20
directory=/app/code/web
command=/app/pkg/app-env.sh node apps/web/server.js
environment=HOSTNAME="127.0.0.1",PORT="3001",NODE_ENV="production"
user=cloudron
autostart=true
autorestart=true
startsecs=10
stopsignal=TERM
stopwaitsecs=4
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# media-server.ts binds upstream's server to 127.0.0.1. NODE_ENV=production keeps Bun out of
# development mode (verbose error pages with stack traces).
[program:media-server]
priority=10
directory=/app/code/media
command=/app/pkg/app-env.sh bun run /app/pkg/media-server.ts
environment=PORT="3456",NODE_ENV="production"
user=cloudron
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
