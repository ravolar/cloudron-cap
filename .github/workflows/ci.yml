# Lint, build the image (with its build-time checks) and run the smoke test for every pull request
# and push to main. Nothing is published here; releases go through "Update Cap" (update.yml).
name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["CloudronVersions.json", "*.md"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Lint
        run: |
          bash -n start.sh app-env.sh test/smoke.sh test/upgrade.sh
          shellcheck -S warning start.sh app-env.sh test/smoke.sh test/upgrade.sh
          python3 -c "import ast; ast.parse(open('prune-workflows.py').read())"
          jq empty CloudronManifest.json CloudronVersions.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (runs the build-time checks)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: cloudron-cap:ci

      - name: Smoke test
        run: test/smoke.sh cloudron-cap:ci

      - name: Upgrade test (last published version with data -> this build)
        run: |
          old=$(jq -r '[.versions | to_entries[] | select(.value.publishState == "published")]
            | sort_by(.key | split(".") | map(tonumber)) | last | .value.manifest.dockerImage // empty' CloudronVersions.json)
          if [[ -z "${old}" ]]; then echo "no published version yet; skipping"; exit 0; fi
          test/upgrade.sh "${old}" cloudron-cap:ci
