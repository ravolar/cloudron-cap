# Release a package version.
#
#   1. Bump "version" in CloudronManifest.json and add a matching [x.y.z] entry to CHANGELOG.
#   2. Push a tag vX.Y.Z on that commit.
#
# The image is built and pushed to GHCR, then the version is appended to CloudronVersions.json
# on main with publishState "testing": Cloudron shows it to existing installs as an "unstable"
# update that is only applied by hand, never automatically. Promote it with the "Promote"
# workflow after testing it on a test server.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7

      - name: Check tag matches manifest version
        id: version
        run: |
          version=$(jq -r .version CloudronManifest.json)
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${version}" >&2
            exit 1
          fi
          grep -q "^\[${version}\]$" CHANGELOG || { echo "CHANGELOG has no [${version}] entry" >&2; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install the cloudron CLI
        run: npm install --global cloudron@9.0.3

      - name: Add the version to CloudronVersions.json on main
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          git fetch origin main
          git checkout main
          if [[ "$(jq -r .version CloudronManifest.json)" != "${VERSION}" ]]; then
            echo "main has moved past ${VERSION}; add the version by hand" >&2
            exit 1
          fi
          cloudron versions add --image "${IMAGE}@${DIGEST}" --state testing
          cloudron versions verify
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CloudronVersions.json
          git commit -m "Release ${VERSION} (testing)"
          git push origin main
